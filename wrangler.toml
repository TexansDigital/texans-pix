# Cloudflare Workers static assets deploy.
#
# The studio is entirely client-side, so this serves files and nothing else.
# It works with a private repo, costs nothing on the free tier, and puts the
# app on the same platform the rest of the plan assumes (R2 for originals,
# Images for the derivative ladder).
#
# Deploy locally:
#   npx wrangler login
#   npm run library && npm run site
#   npx wrangler deploy
#
# Or in CI: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repo secrets
# and .github/workflows/cloudflare.yml takes it from there.

name = "texans-wallpaper-studio"
compatibility_date = "2026-01-01"

[assets]
directory = "./_site"
# A missing file must answer 404, not 200. This is one page at /, not an app
# with client-side routes, so nothing needs a catch-all — and the SPA fallback
# served index.html under every wrong URL, which meant a broken asset path
# looked fine and a deleted file looked like it was still there. `/` still
# resolves to index.html through the default html_handling.
not_found_handling = "none"
