<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Texans Wallpaper Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/brand/tokens.css">
<link rel="stylesheet" href="src/studio.css">
</head>
<body>

<div class="app">

  <!-- Band 1: identity and live status. Deliberately small; a masthead was
       taking a fifth of an iPhone SE. -->
  <header class="bar">
    <img class="bull" src="assets/logos/bullhead-on-dark.png" alt="Texans">
    <div class="bar-text">
      <p id="status" class="stamp">Pick a photo to start</p>
      <button id="device-btn" type="button" class="device-btn">
        <span id="dims">&mdash;</span><span class="edit">change</span>
      </button>
    </div>
    <div class="seg" role="radiogroup" aria-label="Screen">
      <label><input type="radio" name="surface" value="lock" checked><span>Lock</span></label>
      <label><input type="radio" name="surface" value="home"><span>Home</span></label>
    </div>
  </header>

  <!-- Band 2: the preview never leaves the screen. -->
  <section class="preview" aria-label="Wallpaper preview">
    <canvas id="stage" width="390" height="844" aria-label="Wallpaper preview"></canvas>
    <button id="guides-btn" type="button" class="chip-btn" aria-pressed="false"
            title="Show clock and widget zones">Zones</button>
    <button id="reset-btn" type="button" class="chip-btn alt" title="Reset framing">Reset</button>
  </section>

  <!-- Band 3: which group of controls is showing. -->
  <nav class="tabs" role="tablist" aria-label="Controls">
    <button role="tab" class="tab" data-tab="photo" aria-selected="true">Photo</button>
    <button role="tab" class="tab" data-tab="look" aria-selected="false">Look</button>
    <button role="tab" class="tab" data-tab="words" aria-selected="false">Words</button>
    <button role="tab" class="tab" data-tab="saved" aria-selected="false">Saved</button>
  </nav>

  <!-- Band 4: the only scrolling region. -->
  <div class="sheet">

    <section class="pane on" data-pane="photo" role="tabpanel">
      <div id="dropzone" class="dropzone">
        <button id="pick" class="btn primary" type="button">Use my photo</button>
        <input id="file" type="file" accept="image/*" hidden tabindex="-1" aria-hidden="true">
        <p class="hint">Composited on your phone. It never leaves your device.</p>
      </div>
      <div class="lib-head">
        <span class="stamp">Team library</span>
        <span id="lib-count" class="stamp dim"></span>
      </div>
      <div id="library" class="library"></div>
    </section>

    <section class="pane" data-pane="look" role="tabpanel" hidden>
      <div id="templates" class="templates"></div>
    </section>

    <section class="pane" data-pane="words" role="tabpanel" hidden>
      <div class="grid2">
        <label class="field"><span class="stamp">Headline</span>
          <input data-field="headline" type="text" maxlength="28" placeholder="Houston"></label>
        <label class="field"><span class="stamp">Name</span>
          <input data-field="name" type="text" maxlength="24" placeholder="Your name"></label>
      </div>
      <button id="more-fields" class="btn ghost" type="button" aria-expanded="false">More details</button>
      <div class="grid2" id="extra-fields" hidden>
        <label class="field"><span class="stamp">Number</span>
          <input data-field="number" type="text" inputmode="numeric" maxlength="2" placeholder="04"></label>
        <label class="field"><span class="stamp">Section</span>
          <input data-field="section" type="text" maxlength="6" placeholder="132"></label>
        <label class="field"><span class="stamp">Since</span>
          <input data-field="since" type="text" inputmode="numeric" maxlength="4" placeholder="2002"></label>
        <label class="field"><span class="stamp">Kicker</span>
          <input data-field="kicker" type="text" maxlength="24" placeholder="Week 01"></label>
      </div>
    </section>

    <section class="pane" data-pane="saved" role="tabpanel" hidden>
      <p class="hint" id="coll-where">Keep the ones you like and come back to them.</p>
      <button id="keep" class="btn" type="button">Save to my collection</button>
      <div id="collection" class="collection"></div>
    </section>

  </div>

  <!-- Band 5: the action, always reachable, clear of the home indicator. -->
  <div class="actions">
    <button id="export" class="btn primary wide" type="button">Download wallpaper</button>
    <p class="hint tiny">Free. No sign-in, no email.</p>
  </div>

</div>

<!-- Device picker, opened from the status line. Most fans never see it. -->
<dialog id="device-sheet" class="sheet-modal">
  <form method="dialog">
    <div class="sheet-head">
      <h2>Your screen</h2>
      <button class="btn ghost" value="close" type="submit">Done</button>
    </div>
    <label class="field"><span class="stamp">Device</span>
      <select id="device"></select></label>
  </form>
</dialog>

<script type="module" src="src/app.js"></script>
</body>
</html>
