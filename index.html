<!doctype html>
<html lang="en" data-theme="steel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texans Wallpaper Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/brand/tokens.css">
<link rel="stylesheet" href="src/studio.css">
</head>
<body>

<header class="mast">
  <img class="bull" src="assets/logos/bullhead-on-dark.png" alt="">
  <div class="mast-id">
    <h1>Wallpaper Studio</h1>
    <span class="stamp">Houston Texans // Digital</span>
  </div>
  <span class="stamp mast-note">Your photo never leaves this device</span>
</header>

<main class="studio">

  <section class="preview" aria-label="Wallpaper preview">
    <div class="canvas-hold">
      <canvas id="stage" width="1320" height="2868" aria-label="Wallpaper preview canvas"></canvas>
    </div>
    <p id="status" class="stamp status">Pick a photo to start</p>
  </section>

  <section class="controls">

    <fieldset class="panel">
      <legend class="stamp">1 // Photo</legend>
      <div id="dropzone" class="dropzone">
        <button id="pick" class="btn" type="button">Use my photo</button>
        <input id="file" type="file" accept="image/*" hidden tabindex="-1" aria-hidden="true">
        <p class="hint">or drag a file here. JPEG, PNG or WebP.</p>
      </div>
      <div class="lib-head">
        <span class="stamp">Team library</span>
        <span id="lib-count" class="stamp dim"></span>
      </div>
      <div id="library" class="library"><p class="empty">Loading library…</p></div>
    </fieldset>

    <fieldset class="panel">
      <legend class="stamp">2 // Screen</legend>
      <label class="field">
        <span class="stamp">Device</span>
        <select id="device"></select>
      </label>
      <div class="row">
        <div class="seg" role="radiogroup" aria-label="Surface">
          <label><input type="radio" name="surface" value="lock" checked><span>Lock</span></label>
          <label><input type="radio" name="surface" value="home"><span>Home</span></label>
        </div>
        <span id="dims" class="stamp dim"></span>
      </div>
      <label class="check">
        <input id="guides" type="checkbox">
        <span class="stamp">Show clock &amp; widget zones</span>
      </label>
    </fieldset>

    <fieldset class="panel">
      <legend class="stamp">3 // Template</legend>
      <div id="templates" class="templates"></div>
    </fieldset>

    <fieldset class="panel">
      <legend class="stamp">4 // Make it yours</legend>
      <div class="grid2">
        <label class="field"><span class="stamp">Headline</span>
          <input data-field="headline" type="text" maxlength="28" placeholder="Houston"></label>
        <label class="field"><span class="stamp">Name</span>
          <input data-field="name" type="text" maxlength="24" placeholder="Your name"></label>
        <label class="field"><span class="stamp">Number</span>
          <input data-field="number" type="text" inputmode="numeric" maxlength="2" placeholder="04"></label>
        <label class="field"><span class="stamp">Section</span>
          <input data-field="section" type="text" maxlength="6" placeholder="132"></label>
        <label class="field"><span class="stamp">Since</span>
          <input data-field="since" type="text" inputmode="numeric" maxlength="4" placeholder="2002"></label>
        <label class="field"><span class="stamp">Kicker</span>
          <input data-field="kicker" type="text" maxlength="24" placeholder="Week 01"></label>
      </div>
    </fieldset>

    <fieldset class="panel">
      <legend class="stamp">5 // Frame it</legend>
      <label class="field"><span class="stamp">Zoom</span>
        <input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></label>
      <p class="hint">Drag the preview to reposition.</p>
      <button id="export" class="btn primary" type="button">Download wallpaper</button>
    </fieldset>

  </section>
</main>

<script type="module" src="src/app.js"></script>
</body>
</html>
